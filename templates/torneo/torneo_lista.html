{% extends 'torneo/base.html' %}

{% block content %}
  <h1>Torneos</h1>
  <div class="tarjeta">
    <table class="tabla">
      <thead>
        <tr><th>Torneo</th><th>Estado</th><th>Creado</th></tr>
      </thead>
      <tbody>
        {% for t in torneos %}
          <tr>
            <td><a href="{% url 'torneo_detalle' t.slug %}">{{ t.nombre }}</a></td>
            <td>{{ t.get_estado_display }}</td>
            <td class="enlace-suave">{{ t.creado|date:"d/m/Y" }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="3" class="vacio">Todavía no hay torneos cargados.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
