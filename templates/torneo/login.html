{% extends 'torneo/base.html' %}

{% block title %}Entrar — PEPO CUP{% endblock %}

{% block content %}
  <h1>Organizador</h1>
  <form method="post" class="form-carga">
    {% csrf_token %}
    <div class="tarjeta">
      {% if form.errors %}
        <ul class="mensajes"><li class="error">Usuario o contraseña incorrectos.</li></ul>
      {% endif %}
      <p><input type="text" name="username" placeholder="Usuario" autofocus required></p>
      <p><input type="password" name="password" placeholder="Contraseña" required></p>
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
{% endblock %}
